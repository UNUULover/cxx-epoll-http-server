worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log off;
    sendfile on;

    # 三个 ws_server 实例做后端，轮询分发。
    upstream ws_backend {
        server ws1:8080;
        server ws2:8080;
        server ws3:8080;

        # 到后端的连接复用。默认 nginx 对每个请求新建一条到 upstream 的 TCP 连接，
        # 压测下这会变成瓶颈；下面三行是打开 upstream keep-alive 的标准写法。
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # 清掉 close，否则 keepalive 不生效
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
